server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # The service worker must be revalidated so new releases can take control.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite fingerprints compiled assets; cache only those files indefinitely.
    location ~* ^/assets/.+-[a-zA-Z0-9_-]{8,}\.(?:css|js|mjs|woff2?|png|jpe?g|webp|avif|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Public, unfingerprinted files remain cacheable without becoming immutable.
    location ~* \.(?:css|js|mjs|map|woff2?|png|jpe?g|webp|avif|svg|ico|txt|xml|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client routes resolve to the application shell. Keep all HTML fresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
